#TWO WAYS TO RUN ANSIBLE COMMANDS

# Ansible actually has two separate ways to do things: ad-hoc commands (what those two lines are) let you run a single command across all your target 
# servers immediately, right from your terminal, with no file needed at all. Playbooks are for writing out a whole repeatable sequence of steps in a 
# YAML file, meant to be run (and re-run) as a structured, saved process. Ad-hoc commands are basically Ansible's version of "just SSH into every 
# server and run this one command," except it does it for you across all servers at once instead of one at a time.